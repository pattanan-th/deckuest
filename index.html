  * { box-sizing: border-box; }
  button, input, kbd { font-family: inherit; }
  html, body { height: 100%; }
  body {
    margin: 0; background: radial-gradient(ellipse at top, #2a2445, var(--bg) 70%); background-color: var(--bg);
    color: var(--text); font-family: "Anakotmai", "Leelawadee UI", Tahoma, sans-serif;
    display: flex; justify-content: center; align-items: center; user-select: none; overflow: hidden;
  }
  /* one fixed game window: every screen fills it, long content scrolls inside */
  #game { --gh: min(780px, calc(100vh - 32px)); width: min(1080px, calc(100vw - 24px)); height: var(--gh); position: relative; }
  #home, #profiles, #mshop, #inv, #start, #story { height: 100%; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  /* shop: merchant list on the left (20%), the open merchant on the right (80%), each scrolling on its own */
  #mshop { display: flex; flex-direction: column; overflow: hidden; }
  #mshop .mcols { flex: 1; min-height: 0; display: grid; grid-template-columns: 20% 1fr; gap: 16px; margin-top: 4px; }
  #mlist { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; text-align: left; padding-right: 4px; }
  .mitem { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: #0004; cursor: pointer; }
  .mitem:hover { border-color: var(--accent); }
  .mitem.sel { border-color: var(--gold); background: #f5c54218; }
  .mitem .mic { font-size: 24px; line-height: 1; }
  .mitem b { display: block; font-size: 14px; }
  .mitem small { color: var(--dim); font-size: 11px; display: block; }
  .mitem kbd { margin-left: auto; font-size: 11px; }
  #mshop .mright { overflow-y: auto; min-height: 0; padding: 0 6px 8px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  @media (max-width: 860px) {
    #mshop .mcols { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    #mlist { flex-direction: row; overflow-x: auto; overflow-y: hidden; padding: 0 0 4px; }
    .mitem { flex: none; }
    .mitem small, .mitem kbd { display: none; }
  }
  .stBook { font-size: 56px; line-height: 1.1; margin-top: 18px; }
  .stBookT { font-size: 32px; font-weight: 700; color: var(--gold); margin-top: 4px; }
  .stPart { color: var(--dim); margin: 4px 0 18px; }
  .stList { max-width: 640px; margin: 0 auto 12px; text-align: left; }
  .stHead { color: var(--gold); font-weight: 700; margin-top: 30px; }
  .stSub { color: var(--dim); font-style: italic; max-width: 720px; margin: 6px auto 0; }
  .stText { max-width: 720px; margin: 12px auto; text-align: left; line-height: 1.75; font-size: 17px; max-height: calc(var(--gh) - 280px); overflow-y: auto; padding-right: 8px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  .stText p { margin: 0 0 12px; }
  .stNav { justify-content: center; gap: 12px; margin-top: 8px; align-items: center; }
  #play.noxp .xprow { display: none; } /* Adventure has no levels: power comes from gear */
  #play { height: 100%; display: flex; flex-direction: column; }
  #play > #arena { flex: 1; min-height: 190px; height: auto; }
  .overlay { overflow-y: auto; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .hidden { display: none !important; }
  h1 { margin: 0 0 4px; font-size: 40px; letter-spacing: 1px; color: var(--gold); text-shadow: 0 3px 0 #7a5a00; }
  .sub { color: var(--dim); margin: 0 0 20px; }
  button {
    font: inherit; background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 10px 18px;
    cursor: pointer; font-weight: 600;
  }
  button:hover { filter: brightness(1.15); }
  button.ghost { background: transparent; border: 1px solid var(--line); color: var(--text); }
  button.ghost.on { border-color: var(--accent); background: #8e7cff22; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .center { text-align: center; }
  kbd { background: #0006; border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; font-size: 13px; }

  /* top bar */
  #topbar { display: flex; justify-content: space-between; color: var(--dim); font-size: 14px; margin-bottom: 8px; }
  #topbar b { color: var(--text); }

  /* arena */

  /* word */

  #scene { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: min(80%, 780px); text-align: center; font-size: 14px; line-height: 1.5; font-style: italic; color: var(--dim); max-height: 6em; overflow: hidden; pointer-events: none; z-index: 1; }
  #word .done { color: var(--ok); }

  @keyframes wrong { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  #combo { position: absolute; right: 14px; top: 8px; color: var(--gold); font-weight: 700; z-index: 1; }
  /* combo fire: --f = 0.1..1 intensity, --c1 outer flame, --c2 hot core (set from FIRE_TIERS) */
  #wordBox.fire { z-index: 1; border-color: var(--c1);
    box-shadow: 0 0 calc(6px + 28px * var(--f)) var(--c1), inset 0 0 calc(4px + 16px * var(--f)) var(--c1),
                0 calc(-6px - 14px * var(--f)) calc(12px + 28px * var(--f)) calc(-8px + 4px * var(--f)) var(--c2);
    animation: flicker .12s infinite alternate; }
  #wordBox.fire #combo { color: var(--c2); text-shadow: 0 0 10px var(--c1); }
  #wordBox.fire::before, #wordBox.fire::after {
    content: ""; position: absolute; left: 3%; right: 3%; bottom: calc(100% - 8px); pointer-events: none; transform-origin: 50% 100%;
    height: calc(8px + 52px * var(--f)); opacity: calc(.45 + .55 * var(--f)); filter: blur(1.5px);
    background: radial-gradient(ellipse 50% 100% at 50% 100%, var(--c2) 0%, var(--c1) 40%, transparent 72%) 0 100% / 26px 100% repeat-x;
    animation: flames .45s infinite alternate ease-in-out; }
  #wordBox.fire::after { left: 8%; right: 8%; height: calc(4px + 34px * var(--f)); background-size: 18px 100%; animation-duration: .3s; animation-delay: -.15s; filter: blur(1px) brightness(1.3); }
  @keyframes flames { from { transform: scaleY(.8) translateX(-3px); } to { transform: scaleY(1.12) translateX(3px); } }
  @keyframes flicker { from { filter: brightness(1); } to { filter: brightness(calc(1 + .25 * var(--f))); } }

const KINGHOOD = {"intro":{"sub":"","paras":["Here beginneth the story of the sword, the anvil, and the marble stone, and of how that sword was first achieved by an unknown youth, until then of no renown, whether in arms or of estate.","So hearken unto that which I have hereinafter written."]},"c1":{"sub":"How Sir Kay did Combat in a Great Tournament at London Town and of How He Brake His Sword. Likewise, How Arthur Found a New Sword For Him.","paras":["It happened that among those worthies who were summoned unto London Town by the mandate of the Archbishop as above recounted, there was a certain knight, very honorable and of high estate, by name Sir Ector of Bonmaison—surnamed the Trustworthy Knight, because of the fidelity with which he kept the counsel of those who confided in him, and because he always performed unto all men, whether of high or low degree, that which he promised to undertake, without defalcation as to the same. So this noble and excellent knight was held in great regard by all those who knew him; for not only was he thus honorable in conduct but he was, besides, of very high estate, being possessed of seven castles in Wales and in the adjoining country north thereof, and likewise of certain fruitful tracts of land with villages appertaining thereunto, and also of sundry forests of great extent, both in the north country and the west. This very noble knight had two sons; the elder of these was Sir Kay, a young knight of great valor and promise, and already well renowned in the Courts of Chivalry because of several very honorable deeds of worthy achievement in arms which he had performed; the other was a young lad of eighteen years of age, by name Arthur, who at that time was serving with good repute as Sir Kay’s esquire-at-arms.","Now when Sir Ector of Bonmaison received by messenger the mandate of the Archbishop, he immediately summoned these two sons unto him and bade them to prepare straightway for to go with him to London Town, and they did so. And in the same manner he bade a great number of retainers and esquires and pages for to make them ready, and they likewise did so. Thus, with a very considerable array at arms and with great show of circumstance, Sir Ector of Bonmaison betook his way unto London Town in obedience to the commands of the Archbishop.","So, when he had come thither he took up his inn in a certain field where many other noble knights and puissant lords had already established themselves, and there he set up a very fair pavilion of green silk, and erected his banner emblazoned with the device of his house; to wit, a gryphon, black, upon a field of green.","And upon this field were a great multitude of other pavilions of many different colors, and over above each pavilion was the pennant and the banner of that puissant lord to whom the pavilion belonged. Wherefore, because of the multitude of these pennants and banners the sky was at places well-nigh hidden with the gaudy colors of the fluttering flags.","Among the great lords who had come thither in pursuance to the Archbishop’s summons were many very famous kings and queens and noblemen of high degree. For there was King Lot of Orkney, who had taken to wife a step-daughter of Uther-Pendragon, and there was King Uriens of Gore, who had taken to wife another step-daughter of that great king, and there was King Ban, and King Bors, and King Ryance, and King Leodegrance and many others of like degree, for there were no less than twelve kings and seven dukes, so that, what with their court of lords and ladies and esquires and pages in attendance, the town of London had hardly ever seen the like before that day.","Now the Archbishop of Canterbury, having in mind the extraordinary state of the occasion that had brought so many kings and dukes and high lords unto that adventure of the sword and the anvil, had commanded that there should be a very stately and noble tournament proclaimed. Like wise he commanded that this contest at arms should be held in a certain field nigh to the great cathedral, three days before that assay should be made of the sword and the anvil (which same was to be undertaken, as aforesaid, upon Christmas day). To this tournament were bidden all knights who were of sufficient birth, condition, and quality for to fit them to take part therein. Accordingly, very many exalted knights made application for admission, and that in such numbers that three heralds were kept very busy looking into their pretensions unto the right of battle. For these heralds examined the escutcheons and the rolls of lineage of all applicants with great care and circumspection.","Now when Sir Kay received news of this tournament he went to where his father was, and when he stood before his face he spake in this wise: “Sire, being thy son and of such very high condition both as to birth and estate as I have inherited from thee, I find that I have an extraordinary desire to imperil my body in this tourney. Accordingly, if so be I may approve my quality as to knighthood before this college of heralds, it will maybe be to thy great honor and credit, and to the honor and credit of our house if I should undertake this adventure. Wherefore I do crave thy leave to do as I have a mind.”","Unto these Sir Ector made reply: “My son, thou hast my leave for to enter this honorable contest, and I do hope that God will give thee a great deal of strength, and likewise such grace of spirit that thou mayst achieve honor to thyself and credit to us who are of thy blood.”","So Sir Kay departed with very great joy and immediately went to that congress of heralds and submitted his pretensions unto them. And, after they had duly examined into his claims to knighthood, they entered his name as a knight-contestant according to his desire; and at this Sir Kay was filled with great content and joy of heart.","So, when his name had been enrolled upon the list of combatants, Sir Kay chose his young brother Arthur for to be his esquire-at-arms and to carry his spear and pennant before him into the field of battle, and Arthur was also made exceedingly glad because of the honor that had befallen him and his brother.","Now, the day having arrived when this tourney was to be held, a very huge concourse of people gathered together to witness that noble and courtly assault at arms. For at that time London was, as aforesaid, extraordinarily full of nobility and knighthood, wherefore it was reckoned that not less than twenty thousand lords and ladies (besides those twelve kings and their courts and seven dukes and their courts) were assembled in the lists circumadjacent to the field of battle for to witness the performance of those chosen knights. And those noble people sat so close together, and so filled the seats and benches assigned to them, that it appeared as though an entirely solid wall of human souls surrounded that meadow where the battle was to be fought. And, indeed, any knight might well be moved to do his uttermost upon such a great occasion with the eyes of so many beautiful dames and noble lords gazing upon his performances. Wherefore the hearts of all the knights attendant were greatly expanded with emulation to overturn their enemies into the dust.","In the centre of this wonderful court of lords and ladies there was erected the stall and the throne of the lord Archbishop himself. Above the throne was a canopy of purple cloth emblazoned with silver lilies, and the throne itself was hung all about with purple cloth of velvet, embroidered, alternately, with the figure of St. George in gold, and with silver crosses of St. George surrounded by golden halos. Here the lord Archbishop himself sat in great estate and pomp, being surrounded by a very exalted court of clerks of high degree and also of knights of honorable estate, so that all that centre of the field glistered with the splendor of gold and silver embroidery, and was made beautiful by various colors of rich apparel and bright with fine armor of excellent workmanship. And, indeed, such was the stateliness of all these circumstances that very few who were there had ever seen so noble a preparation for battle as that which they then beheld.","Now, when all that great assembly were in their places and everything had been prepared in due wise, an herald came and stood forth before the enstalled throne of the Archbishop and blew a very strong, loud blast upon a trumpet. At that signal the turnpikes of the lists were immediately opened and two parties of knights-contestant entered therein—the one party at the northern extremity of the meadow of battle and the other party at the southern extremity thereof. Then immediately all that lone field was a-glitter with the bright-shining splendor of the sunlight upon polished armor and accoutrements. So these two parties took up their station, each at such a place as had been assigned unto them—the one to the north and the other to the south.","Now the party with which Sir Kay had cast his lot was at the north of the field, and that company was fourscore and thirteen in number; and the other party stood at the south end of the field, and that company was fourscore and sixteen in number. But though the party with whom Sir Kay had attached himself numbered less by three than the other party, yet was it the stronger by some degree because that there were a number of knights of great strength and renown in that company. Indeed it may be here mentioned that two of those knights afterward became companions in very good credit of the round table—to wit: Sir Mador de la Porte, and Sir Bedevere—which latter was the last who saw King Arthur alive upon this earth.","So, when all was prepared according to the ordination of the tournament, and when those knights-contestant had made themselves ready in all ways that were necessary, and when they had dressed their spears and their shields in such a manner as befitted knights about to enter serious battle, the herald set his trumpet to his lips a second time and blew upon it with might and main. Then, having sounded this blast, he waited for a while and then he blew upon the trumpet again.","And, upon that blast, each of those parties of knights quitted its station and rushed forth in great tumult against the other party, and that with such noise and fury that the whole earth groaned beneath the feet of the war-horses, and trembled and shook as with an earthquake.","So those two companies met, the one against the other, in the midst of the field, and the roar of breaking lances was so terrible that those who heard it were astonished and appalled at the sound. For several fair dames swooned away with terror of the noise, and others shrieked aloud; for not only was there that great uproar, but the air was altogether filled with the splinters of ash wood that flew about.","In that famous assault threescore and ten very noble and honorable knights were overthrown, many of them being trampled beneath the hoofs of the horses; wherefore, when the two companies withdrew in retreat each to his station the ground was beheld to be covered all over with broken fragments of lances and with cantels of armor, and many knights were seen to be wofully lying in the midst of all that wreck. And some of these champions strove to arise and could not, while others lay altogether quiet as though in death. To these ran divers esquires and pages in great numbers, and lifted up the fallen men and bare them away to places of safe harborage. And likewise attendants ran and gathered up the cantels of armor and the broken spears, and bare them away to the barriers, so that, by and by, the field was altogether cleared once more.","Then all those who gazed down upon that meadow gave loud acclaim with great joyousness of heart, for such a noble and glorious contest at arms in friendly assay had hardly ever been beheld in all that realm before.","Now turn we unto Sir Kay; for in this assault he had conducted himself with such credit that no knight who was there had done better than he, and maybe no one had done so well as he. For, though two opponents at once had directed their spears against him, yet he had successfully resisted their assault. And one of those two he smote so violently in the midst of his defences that he had lifted that assailant entirely over the crupper of the horse which he rode, and had flung him down to the distance of half a spear’s length behind his steed, so that the fallen knight had rolled thrice over in the dust ere he ceased to fall.","And when those of Sir Kay’s party who were nigh to him beheld what he did, they gave him loud and vehement acclaim, and that in such measure that Sir Kay was wonderfully well satisfied and pleased at heart.","And, indeed, it is to be said that at that time there was hardly any knight in all the world who was so excellent in deeds of arms as Sir Kay. And though there afterward came knights of much greater renown and of more glorious achievement (as shall be hereinafter recorded in good season), yet at that time Sir Kay was reckoned by many to be one of the most wonderfully puissant knights (whether errant or in battle) in all of that realm.","So was that course of the combat run to the great pleasure and satisfaction of all who beheld it, and more especially of Sir Kay and his friends. And after it had been completed the two parties in array returned each to its assigned station once more.","And when they had come there, each knight delivered up his spear unto his esquire. For the assault which was next to be made was to be undertaken with swords, wherefore all lances and other weapons were to be put away; such being the order of that courteous and gentle bout at arms.","Accordingly, when the herald again blew upon his trumpet, each knight drew his weapon with such readiness for battle that there was a great splendor of blades all flashing in the air at once. And when the herald blew a second time each party pushed forward to the contest with great nobleness of heart and eagerness of spirit, every knight being moved with intent to engage his oppugnant with all the might and main that lay in him.","Then immediately began so fierce a battle that if those knights had been very enemies of long standing instead of friendly contestants, the blows which they delivered the one upon the other could not have been more vehement as to strength or more astonishing to gaze upon.","And in this affair likewise Sir Kay approved himself to be so extraordinary a champion that his like was nowhere to be seen in all that field; for he violently smote down five knights, the one after the other, ere he was stayed in his advance.","Wherefore, beholding him to be doing work of such a sort, several of the knights of the other party endeavored to come at him with intent to meet him in his advance.","Amongst these was a certain knight, hight Sir Balamorgineas, who was so huge of frame that he rode head and shoulders above any other knight. And he was possessed of such extraordinary strength that it was believed that he could successfully withstand the assault of three ordinary knights at one time. Wherefore when this knight beheld the work that Sir Kay did, he cried out to him, “Ho! ho! Sir Knight of the black gryphon, turn thou hitherward and do a battle with me!”","Now when Sir Kay beheld Sir Balamorgineas to be minded to come against him in that wise—very threateningly and minded to do him battle—he turned him toward his enemy with great cheerfulness of spirit. For at that time Sir Kay was very full of youthful fire and reckoned nothing of assaulting any enemy who might demand battle of him.","(So it was at that time. But it after befell, when he became Seneschal, and when other and mightier knights appeared at the court of the King, that he would sometimes avoid an encounter with such a knight as Sir Launcelot, or Sir Pellias, or Sir Marhaus, or Sir Gawaine, if he might do so with credit to his honor.)","So, being very full of the spirit of youth, he turned him with great lustiness of heart, altogether inflamed with the eagerness and fury of battle. And he cried out in a great voice, “Very well, I will do battle with thee, and I will cast thee down like thy fellows!” And therewith he smote with wonderful fierceness at Sir Balamorgineas, and that with all his might. And Sir Balamorgineas received the stroke upon his helmet and was altogether bewildered by the fury thereof, for he had never felt its like before that time. Wherefore his brains swam so light that it was necessary for him to hold to the horn of his saddle to save himself from falling.","But it was a great pity for Sir Kay that, with the fierceness of the blow, his sword-blade snapped short at the haft, flying so high in the air that it appeared to overtop the turrets of the cathedral in its flight. Yet so it happened, and thus it befell that Sir Kay was left without any weapon. Yet it was thought that, because of that stroke, he had Sir Balamorgineas entirely at his mercy, and that if he could have struck another blow with his sword he might easily have overcome him.","But as it was, Sir Balamorgineas presently so far recovered himself that he perceived his enemy to be altogether at his mercy; wherefore, being filled beyond measure with rage because of the blow he had received, he pushed against Sir Kay with intent to smite him down in a violent assault.","In this pass it would maybe have gone very ill with Sir Kay but that three of his companions in arms, perceiving the extreme peril in which he lay, thrust in betwixt him and Sir Balamorgineas with intent to take upon themselves the assault of that knight and so to save Sir Kay from overthrow. This they did with such success that Sir Kay was able to push out from the press and to escape to the barriers without suffering any further harm at the hands of his enemies.","Now when he reached the barrier, his esquire, young Arthur, came running to him with a goblet of spiced wine. And Sir Kay opened the umbril of his helmet for to drink, for he was athirst beyond measure. And, lo! his face was all covered over with blood and sweat, and he was so a-drought with battle that his tongue clave to the roof of his mouth and he could not speak. But when he had drunk of the draught that Arthur gave him, his tongue was loosened and he cried out to the young man in a loud and violent voice: “Ho! ho! Brother, get me another sword for to do battle, for I am assuredly winning for our house much glory this day!” And Arthur said, “Where shall I get thee a sword?” And Kay said, “Make haste unto our father’s pavilion and fetch me thence another sword, for this which I have is broken.” And Arthur said, “I will do so with all speed,” and thereupon he set hand to the barrier and leaped over it into the alleyway beyond. And he ran down the alleyway with all the speed that he was able with intent to fulfil that task which his brother had bidden him to undertake; and with like speed he ran to that pavilion that his father had set up in the meadows.","But when he came to the pavilion of Sir Ector he found no one there, for all the attendants had betaken themselves unto the tournament. And neither could he find any sword fit for his brother’s handling, wherefore he was put to a great pass to know what to do in that matter.","In this extremity he bethought him of that sword that stood thrust into the anvil before the cathedral, and it appeared to him that such a sword as that would suit his brother’s purposes very well. Wherefore he said to himself, “I will go thither and get that sword if I am able to do so, for it will assuredly do very well for my brother for to finish his battle withal.” Whereupon he ran with all speed to the cathedral. And when he had come there he discovered that no one was there upon guard at the block of marble, as had heretofore been the case, for all who had been upon guard had betaken themselves unto the contest of arms that was toward. And the anvil and the sword stood where he could reach them. So, there being no one to stay young Arthur, he leaped up upon the block of marble and laid his hands unto the hilt of the sword. And he bent his body and drew upon the sword very strongly, and, lo! it came forth from the anvil with wonderful smoothness and ease, and he held the sword in his hand, and it was his.","And when he had got the sword in that way, he wrapped it in his cloak so that no one might see it (for it shone with an exceeding brightness and splendor) and he leaped down from the block of marble stone and hastened with it unto the field of battle.","Now when Arthur had entered into that meadow once more, he found Sir Kay awaiting his coming with great impatience of spirit. And when Sir Kay saw him he cried out, very vehemently, “Hast thou got a sword?” And Arthur said, “Yea, I have one here.” Thereupon he opened his cloak and showed Sir Kay what sword it was he had brought.","Now when Sir Kay beheld the sword he immediately knew it, and he wist not what to think or what to say, wherefore he stood for a while, like one turned into a stone, looking upon that sword. Then in awhile he said, in a very strange voice “Where got ye that sword?” And Arthur looked upon his brother and he beheld that his countenance was greatly disturbed, and that his face was altogether as white as wax. And he said, “Brother, what ails thee that thou lookest so strangely. I will tell the entire truth. I could find no sword in our father’s pavilion, wherefore I bethought me of that sword that stood in the anvil upon the marble cube before the cathedral. So I went thither and made assay for to draw it forth, and it came forth with wonderful ease. So, when I had drawn it out, I wrapped it in my cloak and brought it hither unto thee as thou beholdest.”","Then Sir Kay turned his thoughts inward and communed with himself in this wise, “Lo! my brother Arthur is as yet hardly more than a child. And he is, moreover, exceedingly innocent. Therefore he knoweth not what he hath done in this nor what the doing thereof signifieth. Now, since he hath achieved this weapon, why should I not myself lay claim to that achievement, and so obtain the glory which it signifieth.” Whereupon he presently aroused himself, and he said to Arthur, “Give the sword and the cloak to me,” and Arthur did as his brother commanded. And when he had done so Sir Kay said to him, “Tell no man of this but keep it privy in thine own heart. Meantime go thou to our father where he sits at the lists and bid come straightway unto the pavilion where we have taken up our inn.”","And Arthur did as Sir Kay commanded him, greatly possessed with wonder that his brother should be so disturbed in spirit as he had appeared to be. For he wist not what he had done in drawing out that sword from the anvil, nor did he know of what great things should arise from that little thing, for so it is in this world that a man sometimes approves himself to be worthy of such a great trust as that, and yet, in lowliness of spirit, he is yet altogether unaware that he is worthy thereof. And so it was with young Arthur at that time."]},"c2":{"sub":"How Arthur Twice Performed the Miracle of the Sword Before Sir Ector and of How His Birthright Was Discovered Unto Him.","paras":["So Arthur made haste to that part of the lists where Sir Ector sat with the people of his household. And he stood before his father and said, “Sire, my brother Kay hath sent me hitherward for to bid thee come straightway unto the pavilion where we have taken up our inn. And, truly, I think something very extraordinary hath befallen, for my brother Kay hath such a countenance as I never saw him wear.”","Then Sir Ector marvelled very greatly what it was that should cause Sir Kay to quit that battle and to summon him at such a time, wherefore he arose from where he sat and went with Arthur. And they went to the pavilion, and when he had come there, behold! Sir Kay was standing in the midst of the pavilion. And Sir Ector saw that his face was as white as ashes of wood and that his eyes shone with a wonderful brightness. And Sir Ector said, “My son, what ails thee?” whereunto Sir Kay made reply, “Sire, here is a very wonderful matter.” Therewith he took his father by the hand and brought him to the table that stood in the pavilion. And upon the table there lay a cloak and there was something within the cloak. Then Sir Kay opened the cloak and, lo! there lay the sword of the anvil, and the hilt thereof and the blade thereof glistered with exceeding splendor.","And Sir Ector immediately knew that sword and whence it came. Wherefore he was filled with such astonishment that he wist not what to do. And for a while his tongue refused to speak, and after a while he found speech and cried out aloud in a great voice, “What is this that mine eyes behold!”","To this Sir Kay made reply, “Sire. I have that sword which stood a while since embedded in the anvil that stands upon the cube of marble stone before the great cathedral. Wherefore I demand that thou tellest me what this may foretend?”","Then Sir Ector said, “How came you by that sword?”","And for a while Sir Kay was silent, but after a while he said, “Sire, I brake my sword in that battle which of late I fought, whereupon I found me this sword in its stead.”","Then Sir Ector was altogether bemazed and knew not whether to believe what his ears heard. And after awhile he said, “If so be that thou didst draw forth this sword from the anvil, then it must also be that thou art rightwise King of Britain, for so the saying of the sword proclaimeth. But if thou didst indeed draw it forth from the anvil, then it will be that thou shalt as easily be able for to thrust it back again into that place from whence thou didst take it.”","At this a great trouble of spirit fell upon Sir Kay, and he cried out in a very loud voice, “Who may do such a thing as that, and who could perform so great a miracle as to thrust a sword into solid iron.” Whereunto Sir Ector made reply, “Such a miracle is no greater than the miracle that thou hast performed in drawing it out from its embedment. For who ever heard that a man could draw forth a sword from a place and yet would not thrust it back whence he drew it?”","Then Sir Kay wist not what to say to his father, and he greatly feared that he should not be able to perform that miracle. But, nevertheless, he took what comfort to himself he was able, saying, “If my young brother Arthur was able to perform this miracle why should I not do a miracle of a like sort, for, assuredly, I am not less worthy than he. Wherefore if he drew the sword forth with such ease, it may be that I with equal ease shall be able to thrust it back into its place again.” Accordingly he took such comfort to himself in these thoughts as he was able.","So he wrapped the sword in the cloak again, and when he had done so he and Sir Ector went forth from the pavilion and betook their way unto where was the marble stone and the anvil before the cathedral. And Arthur went with his father and his brother and they forebade him not. And when they had come to that place where the sword had been, Sir Kay mounted upon the cube of marble stone and beheld the face of the anvil. And lo! the face of the anvil was altogether smooth and without a scratch or scar of any sort. And Sir Kay said to himself, “What is this my father would have me do! What man is there in life who could thrust a sword-blade into a solid anvil of iron?” But, ne’theless, he could not withdraw from that impossible undertaking, but was constrained to assay that miracle, wherefore he set the point of the sword to the iron and bore upon it with all his strength. But it was impossible for him to accomplish that thing, and though he endeavored with all his might with the sword against the face of the anvil, yet did he not pierce the iron even to the breadth of a hair.","So, after he had thus assayed for a great while, he at last ceased what he did and came down from where he stood. And he said to his father, “Sire, no man in life may perform that miracle.”","Unto this Sir Ector made reply, “How is it possible then that thou couldst have drawn out that sword as thou sayst and yet cannot put it back again?”","Then young Arthur lifted up his voice and said, “My father, have I thy leave to speak?” And Sir Ector said, “Speak, my son.” And Arthur said, “I would that I might assay to handle that sword?” Whereunto Sir Ector replied, “By what authority wouldst thou handle that sword?” And Arthur said, “Because it was I who drew that sword forth from the anvil for my brother. Wherefore, as thou sayest, to draw it forth is not more difficult than to thrust it back again. So I believe that I shall be able to set it back into the iron whence I drew it.”","Then Sir Ector gazed upon young Arthur in such a strange manner that Arthur wist not why he looked at him in that wise. Wherefore he cried out, “Sire, why dost thou gaze so strangely upon me? Has thou anger against me?” Whereunto Sir Ector made reply, “In the sight of God, my son, I have no anger against thee.” Then he said, “If thou hast a desire to handle the sword, thou mayst assuredly make assay of that miracle.”","So Arthur took the sword from his brother Kay and he leaped up upon the marble stone. And he set the point of the sword upon the anvil and bare very strongly upon it and lo! the sword penetrated very smoothly into the centre of the anvil until it stood midway deep therein, and there it stood fast. And after he had performed that miracle he drew the sword forth again very swiftly and easily, and then thrust it back again once more as he had done before.","But when Sir Ector beheld what Arthur did, he cried out in a voice of exceeding loudness, “Lord! Lord! what is the miracle mine eyes behold!” And when Arthur came down from the cube of marble stone, Sir Ector kneeled down before him and set his hands together, palm to palm.","But when Arthur beheld what his father did, he cried out aloud like one in a great measure of pain; and he said, “My father! my father! why dost thou kneel down to me?”","To him Sir Ector made reply, “I am not thy father, and now it is made manifest that thou art assuredly of very exalted race and that the blood of kings flows in thy veins, else thou couldst not have handled that sword as thou hast done.”","Then Arthur fell a-weeping beyond all measure and he cried out as with great agony of spirit, “Father! father! what is this thou sayst? I beseech thee to arise and not to kneel unto me.”","So Sir Ector arose from his knees and stood before the face of Arthur, and he said, “Arthur, why dost thou weep?” And Arthur said, “Because I am afeard.”","Now all this while Sir Kay had stood near by and he could neither move nor speak, but stood like one entranced, and he said to himself, “What is this? Is my brother a King?”","Then Sir Ector spake, saying, “Arthur, the time hath come for thee to know thyself, for the true circumstances of thy life have, heretofore, been altogether hidden from thee.","“Now I do confess everything to thee in this wise: that eighteen year ago there came to me a certain man very wise and high in favor with Uther-Pendragon and that man was the Enchanter Merlin. And Merlin showed me the signet ring of Uther-Pendragon and he commanded me by virtue of that ring that I should be at a certain assigned place at a particular time which he nominated; and the place which he assigned was the postern gate of Uther-Pendragon’s castle; and the time which he named was midnight of that very day.","“And he bade me tell no man aught concerning those things which he communicated to me, and so I kept his counsel as he desired me to do.","“So I went to that postern gate at midnight as Merlin had commanded, and at that place there came unto me Merlin and another man, and the other man was Sir Ulfius, who was the chief knight of Uther-Pendragon’s household. And I tell thee that these two worthies stood nigher unto Uther-Pendragon than any other men in all of the world.","“Now when those two came unto me, I perceived that Merlin bare in his arms a certain thing wrapped in a scarlet mantle of fine texture. And he opened the folds of the mantle and, lo! I beheld a child not long born and wrapped in swaddling clothes. And I saw the child in the light of a lanthorn which Sir Ulfius bare, and I perceived that he was very fair of face and large of bone—and thou wert that child.","“Then Merlin commanded me in this wise: that I was to take that child and that I should rear him as mine own; and he said that the child was to be called by the name of Arthur; and he said that no one in all the world was to know otherwise than that the child was mine own. And I told Merlin that I would do as he would have me, whereupon I took the child and bare it away with me. And I proclaimed that the child was mine own, and all over the world believed my words, wherefore no one ever knew otherwise than that thou wert mine own son. And that lady who was my wife, when she died she took that secret with her unto Paradise, and since then until now no one in all the world knew aught of this matter but I and those two aforementioned worthies.","“Nor have I until now ever known aught of who was thy father; but now I do suspect who he was and that thou hast in thy veins very high and kingly blood. And I do have in mind that perhaps thy father was Uther-Pendragon himself. For who but the son of Uther-Pendragon could have drawn forth that sword from out of the anvil as thou hast done?”","Then, when Arthur heard that saying of his father’s, he cried out in a very loud and vehement voice, “Woe! Woe! Woe!”—saying that word three times. And Sir Ector said, “Arthur, why art thou woful?” And Arthur said, “Because I have lost my father, for I would rather have my father than be a King!”","Now as these things passed, there came unto that place two men, very tall and of a wonderfully noble and haughty appearance. And when these two men had come nigh to where they were, Arthur and Sir Ector and Sir Kay preceived that one of them was the Enchanter Merlin and that the other was Sir Ulfius—for those two men were very famous and well known unto all the world. And when those two had come to where were the three, Merlin spake, saying, “What cheer?” And Sir Ector made answer, “Here is cheer of a very wonderful sort; for, behold, Merlin! this is that child that thou didst bring unto me eighteen years ago, and, lo! thou seest he hath grown unto manhood.”","Then Merlin said, “Sir Ector, I know very well who is this youth, for I have kept diligent watch over him for all this time. And I know that in him lieth the hope of Britain. Moreover, I tell thee that even to-day within the surface of an enchanted looking-glass I have beheld all that he hath done since the morning; and I know how he drew forth the sword from the anvil, and how he thrust it back again; and I know how he drew it forth and thrust it back a second time. And I know all that thou hast been saying unto him this while; wherefore I also do now avouch that thou hast told him the very truth. And, lo! the spirit of prophecy is upon me and I do foresee into the future that thou, Arthur, shall become the greatest and most famous King that ever lived in Britain; and I do foresee that many knights of extraordinary excellence shall gather about thee and that men shall tell of their marvellous deeds as long as this land shall continue, and I do foresee that through these knights thy reign shall be full of splendor and glory; and I do foresee that the most marvellous adventure of the Holy Grail shall be achieved by three of the knights of thy Court, and that to thy lasting renown, who shall be the King under whose reign the holy cup shall be achieved. All these things I foresee; and, lo! the time is now at hand when the glory of thy House shall again be made manifest unto the world, and all the people of this land shall rejoice in thee and thy kinghood. Wherefore, Sir Ector, for these three days to come, I do charge it upon thee that thou do guard this young man as the apple of thine eye, for in him doth lie the hope and salvation of all this realm.”","Then Sir Ector lifted up his voice and cried unto Arthur, “A boon! a boon!” And Arthur said, “Alas! how is this? Dost thou, my father, ask a boon of me who may have all in the world that is mine to give? Ask what thou wilt and it is thine!” Then Sir Ector said, “I do beseech this of thee: that when thou art King thy brother Kay may be Seneschal of all this realm.” And Arthur said, “It shall be as thou dost ask.” And he said, “As for thee, it shall be still better with thee, for thou shalt be my father unto the end!” Whereupon so saying, he took Sir Ector’s head into his hands and he kissed Sir Ector upon the forehead and upon the cheeks, and so sealed his plighted word.","But all this while Sir Kay had stood like unto one struck by thunder, and he wist not whether to be uplifted unto the skies or to be cast down into the depths, that his young brother should thus have been passed by him and exalted unto that extraordinary altitude of fortune. Wherefore he stood like to one bereft of life and motion.","And let it here be said that Arthur fulfilled all that he had thus promised to his father—for, in after times, he made Sir Kay his Seneschal, and Sir Ector was to him a father until the day of his death, which same befell five years from that time.","Thus I have told you how the royalty of Arthur was first discovered. And now, if you will listen, ye shall hear how it was confirmed before all the world."],"talk":[{"s":"A","t":"sire my brother kay hath sent me hitherward for to bid thee","c":"So Arthur made haste to that part of the lists where Sir Ector sat with the people of his household. And he stood before his father and said,"},{"s":"E","t":"my son what ails thee","c":"…to the pavilion,  him and set his hands together, palm to palm. But when Arthur beheld what his father did, he cried out aloud like one in a great measure of pain; and he said,"},{"s":"E","t":"i am not thy father and now it is made manifest that thou art","c":""},{"s":"E","t":"arthur why dost thou weep","c":"So Sir Ector arose from his knees and stood before the face of Arthur, and he said,"},{"s":"A","t":"because i am afeard","c":""},{"s":"K","t":"what is this is my brother a king","c":"Now all this while Sir Kay had stood near by and he could neither move nor speak, but stood like one entranced, and he said to himself,"},{"s":"E","t":"arthur the time hath come for thee to know thyself","c":""},{"s":"E","t":"now i do confess everything to thee in this wise","c":""},{"s":"E","t":"i beheld a child not long born and wrapped in swaddling clothes","c":""},{"s":"E","t":"i do have in mind that thy father was uther pendragon himself","c":""},{"s":"A","t":"woe woe woe","c":"Then, when Arthur heard that saying of his father’s, he cried out in a very loud and vehement voice,"},{"s":"E","t":"arthur why art thou woful","c":"—saying that word three times. And Sir Ector said,"},{"s":"A","t":"because i have lost my father","c":""},{"s":"M","t":"what cheer","c":"…Sir Kay preceived that one of them was the Enchanter Merlin and that the other was Sir Ulfius—for those two men were very famous and well known unto all the world. And when those two had come to where were the three, Merlin spake, saying,"},{"s":"E","t":"here is cheer of a very wonderful sort","c":""},{"s":"M","t":"sir ector i know very well who is this youth","c":""},{"s":"M","t":"thou arthur shall become the greatest and most famous king that ever lived in britain","c":""},{"s":"E","t":"a boon a boon","c":"Then Sir Ector lifted up his voice and cried unto Arthur,"},{"s":"A","t":"alas how is this","c":""},{"s":"E","t":"i do beseech this of thee","c":""},{"s":"A","t":"it shall be as thou dost ask","c":""},{"s":"A","t":"as for thee it shall be still better with thee","c":""}]},"c3":{"sub":"How Several Kings and High Dukes Assayed to Draw the Sword Out of the Anvil and How They Failed. Likewise How Arthur Made the Assay and Succeeded Therein.","paras":["So when the morning of Christmas day had come, many thousands of folk of all qualities, both gentle and simple, gathered together in front of the cathedral for to behold the assay of that sword.","Now there had been a canopy of embroidered cloth of divers colors spread above the sword and the anvil, and a platform had been built around about the cube of marble stone. And nigh unto that place there had been a throne for the Archbishop established; for the Archbishop was to overlook that assay and to see that every circumstance was fulfilled with due equity and circumspection.","So, when the morning was half gone by, the Archbishop himself came with great pomp of estate and took his seat upon the high throne that had been placed for him, and all his court of clerks and knights gathered about him, so that he presented a very proud and excellent appearance of courtliness.","Now unto that assay there had gathered nineteen kings and sixteen dukes, and each of these was of such noble and exalted estate that he entertained high hopes that he would that day be approved before the world to be the right king and overlord of all Britain. Wherefore after the Archbishop had established himself upon his throne, there came several of these and made demand that he should straightway put that matter to the test. So the Archbishop commanded his herald for to sound a trumpet, and to bid all who had the right to make assay of the sword to come unto that adventure, and the herald did according as the Archbishop ordered.","And when the herald had sounded his trumpet there immediately appeared the first of those kings to make trial of the sword, and he who came was King Lot of Orkney and the Isles. With King Lot there came eleven knights and five esquires, so that he appeared in very noble estate before the eyes of all. And when King Lot had arrived at that place, he mounted the platform. And first he saluted the Archbishop, and then he laid his hands to the pommel of the sword in the sight of all. And he bent his body and drew upon the sword with great strength, but he could not move the blade in the anvil even so much as the breadth of a hair, for it stood as fast as the iron in which it was planted. And after that first assay he tried three times more, but still he was altogether unable to move the blade in the iron. Then, after that he had thus four times made assay, he ceased his endeavor and came down from that place. And he was filled with great anger and indignation that he had not succeeded in his endeavor.","And after King Lot there came his brother-in-law, King Urien of Gore, and he also made assay in the same wise as King Lot had done. But neither did he succeed any better than that other king. And after King Urien there came King Fion of Scotland, and after King Fion there came King Mark of Cornwall, and after King Mark there came King Ryence of North Wales, and after King Ryence there came King Leodegrance of Cameliard, and after him came all those other kings and dukes before numerated, and not one of all these was able to move the blade. And some of these high and mighty lords were filled with anger and indignation that they had not succeeded, and others were ashamed that they had failed in that undertaking before the eyes of all those who looked upon them. But whether they were angry or whether they were ashamed it in no wise helped their case.","Now when all the kings and dukes had thus failed in that adventure, the people who were there were very much astonished, and they said to one another, “How is this? If all those kings and dukes of very exalted estate have failed to achieve that adventure, who then may hope to succeed? For here have been all those who were most worthy of that high honor, and all have tried to draw that sword and all have failed. Who then is there now to come after these who may hope to succeed?”","And, likewise, those kings and dukes spoke together in the same manner. And by and by there came six of the most worthy—to wit, King Lot, King Urien, King Pellinore, King Ban, King Ryence, and Duke Clarence of Northumberland—and these stood before the throne of the Archbishop and spake to him in this wise: “Sir, here have all the kings and dukes of this realm striven before you for to draw forth that sword, and lo! not one of all those who have undertaken that thing hath succeeded in his undertaking. What, then, may we understand but that the enchanter Merlin hath set this adventure for to bring shame and discredit upon all of us who are here, and upon you, who are the head of the church in this realm? For who in all the world may hope to draw forth a sword-blade out from a bed of solid iron? Behold! it is beyond the power of any man. Is it not then plain to be seen that Merlin hath made a mock of us all? Now, therefore, lest all this great congregation should have been called here in vain, we do beseech you of your wisdom that you presently choose the one from among the kings here gathered, who may be best fitted to be overlord of this realm. And when ye shall have chosen him, we will promise to obey him in all things whatsoever he may ordain. Verily, such a choice as that will be better worth while than to spend time in this foolish task of striving to draw forth a sword out of an anvil which no man in all the world may draw forth.”","Then was the Archbishop much troubled in spirit, for he said to himself, “Can it be sooth that Merlin hath deceived me, and hath made a mock of me and of all these kings and lordly folk? Surely this cannot be. For Merlin is passing wise, and he would not make a mock of all the realm for the sake of so sorry a jest as this would be. Certes he hath some intent in this of which we know naught, being of less wisdom than he—wherefore I will be patient for a while longer.” Accordingly, having communed thus within himself, he spake aloud in this wise to those seven high lords: “Messires,” he said, “I have yet faith that Merlin hath not deceived us, wherefore I pray your patience for one little while longer. For if, in the time a man may count five hundred twice over, no one cometh forward to perform this task, then will I, at your behest, proceed to choose one from amongst you and will proclaim him King and Overlord of all.” For the Archbishop had faith that Merlin was about to immediately declare a king before them all.","Now leave we these and turn we unto Arthur and his father and brother.","For Merlin had bidden those three to abide in their pavilion until such time as he thought would be fit for them to come out thence. And that time being now come, Merlin and Sir Ulfius went to the pavilion of Sir Ector, and Merlin said, “Arthur, arise and come forth, for now the hour is come for thee to assay before the whole world that miracle which thou didst of late execute in privacy.” So Arthur did as Merlin bade him to do, and he came forth from the pavilion with his father and his brother, and, lo! he was like one who walked in a dream.","So they five went down from thence toward the cathedral and unto that place of assay. And when they had come to the congregation there assembled, the people made way for them, greatly marvelling and saying to one another, “Who are these with the Enchanter Merlin and Sir Ulfius, and whence come they? For all the world knew Merlin and Sir Ulfius, and they wist that here was something very extraordinary about to happen. And Arthur was clad all in flame-colored raiment embroidered with threads of silver, so that others of the people said, “Certes, that youth is very fair for to look upon; now who may he be?”","But Merlin said no word to any man, but he brought Arthur through the press unto that place where the Archbishop sat; and the press made way for him so that he was not stayed in his going. And when the Archbishop beheld Merlin come thus with those others, he arose and said, “Merlin, who are these whom thou bringest unto us, and what is their business here?” And Merlin said, “Lord, here is one come to make the assay of yonder sword.” And the Archbishop said, “Which one is he?” and Merlin said, “This is he,” and he laid his hand upon Arthur.","Then the Archbishop looked upon Arthur and he beheld that the youth was very comely of face, wherefore his heart went out unto Arthur and he loved him a very great deal. And the Archbishop said, “Merlin, by what right doth this young man come hither?” And Merlin made reply, “Lord, he cometh hither by the best right that there is in the world; for he who standeth before thee clad in red is the true son of Uther-Pendragon and of his lawful wife, Queen Igraine.”","Then the Archbishop cried out aloud in great amazement and those who stood nigh and who heard what Merlin said were so astonished that they wist not what to think. And the Archbishop said, “Merlin, what is this that thou tellest me? For who, until now, in all the world hath ever heard that Uther-Pendragon had a son?”","Unto this Merlin made reply: “No one hath ever known of such a thing until now, only a very few. For it was in this wise: When this child was born the spirit of prophecy lay upon me and I foresaw that Uther-Pendragon would die before a very great while. Wherefore I feared that the enemies of the King would lay violent hands upon the young child for the sake of his inheritance. So, at the King’s behest, I and another took the young child from his mother and gave him unto a third, and that man received the kingly child and maintained him ever since as his own son. And as to the truth of these things there are others here who may attest the verity of them—for he who was with me when the young child was taken from his mother was Sir Ulfius, and he to whom he was entrusted was Sir Ector of Bonmaison—and those two witnesses, who are without any reproach, will avouch to the verity of that which I have asserted, for here they stand before thee to certify unto what I have said.”","And Sir Ulfius and Sir Ector said, “All that Merlin hath spoken is true, and thereunto we do pledge our most faithful and sacred word of honor.”","Then the Archbishop said, “Who is there may doubt the word of such honorable witnesses?” And he looked upon Arthur and smiled upon him.","Then Arthur said, “Have I then thy leave, Lord, to handle yonder sword?” And the Archbishop said, “Thou hast my leave, and may the grace of God go with thee to do thy endeavor.”","Thereupon Arthur went to the cube of marble stone and he laid his hands upon the haft of the sword that was thrust into the anvil. And he bent his body and drew very strongly and, lo! the sword came forth with great ease and very smoothly. And when he had got the sword into his hands, he swung it about his head so that it flashed like lightning. And after he had swung it thus thrice about his head, he set the point thereof against the face of the anvil and bore upon it very strongly, and, behold! the sword slid very smoothly back again into that place where it had aforetime stood; and when it was there, midway deep, it stood fast where it was. And thus did Arthur successfully accomplish that marvellous miracle of the sword in the eyes of all the world.","Now when the people who were congregated at that place beheld this miracle performed before their faces, they lifted up their voices all together, and shouted so vehemently and with so huge a tumult of outcry that it was as though the whole earth rocked and trembled with the sound of their shouting.","And whiles they so shouted Arthur took hold of the sword again and drew it forth and swung it again, and again drave it back into the anvil. And when he had done that he drew it forth a third time and did the same thing as before. Thus it was that all those who were there beheld that miracle performed three times over.","And all the kings and dukes who were there were filled with great amazement, and they wist not what to think or to say when they beheld one who was little more than a boy perform that undertaking in which the best of them had failed. And some of them, seeing that miracle, were willing to acknowledge Arthur because of it, but others would not acknowledge him. These withdrew themselves and stood aloof; and as they stood thus apart, they said among themselves: “What is this and who can accredit such a thing that a beardless boy should be set before us all and should be made King and overlord of this great realm for to govern us. Nay! nay! we will have none of him for our King.” And others said, “Is it not apparent that Merlin and Sir Ulfius are thus exalting this unknown boy so that they may elevate themselves along with him?” Thus these discontented kings spake among themselves, and of all of them the most bitter were King Lot and King Urien, who were brothers by marriage with Arthur.","Now when the Archbishop perceived the discontent of these kings and dukes, he said to them, “How now, Messires! Are ye not satisfied?” And they said, “We are not satisfied.” And the Archbishop said, “What would ye have?” And they said, “We would have another sort of king for Britain than a beardless boy of whom no one knoweth and of whose birthright there are only three men to attest.” And the Archbishop said “What of that? Hath he not performed the miracle that ye yourselves assayed and failed to perform?”","But these high and mighty lords would not be satisfied, but with angry and averted faces they went away from that place, filled with wrath and indignation.","But others of these kings and dukes came and saluted Arthur and paid him court, giving him joy of that which he had achieved; and the chiefest of those who came thus unto him in friendliness was King Leodegrance of Cameliard. And all the multitude acknowledged him and crowded around that place shouting so that it sounded like to the noise of thunder.","Now all this while Sir Ector and Sir Kay had stood upon one side. And they were greatly weighed down by sorrow; for it appeared to them that Arthur had, of a sudden, been uplifted so far from their estate that they might never hope to approach him more. For now he was of kingly consequence and they but common knights. And, after awhile, Arthur beheld them where they stood with downcast looks, whereupon he straightway went to them and took first one and then the other by the hand and kissed each upon the cheek. Thereupon they were again very glad at being thus uplifted unto him.","And when Arthur departed from that place, great crowds of people followed after him so that the streets were altogether filled with the press of people. And the multitude continually gave him loud acclaim as the chosen King of England, and those who were nearest to him sought to touch the hem of his garments; wherefore the heart of Arthur was exceedingly uplifted with great joy and gladness, so that his soul took wing and flew like a bird into the sky.","Thus Arthur achieved the adventure of the sword that day and entered into his birthright of royalty. Wherefore, may God grant His Grace unto you all that ye too may likewise succeed in your undertakings. For any man may be a king in that life in which he is placed if so be he may draw forth the sword of success from out of the iron of circumstance. Wherefore when your time of assay cometh, I do hope it may be with you as it was with Arthur that day, and that ye too may achieve success with entire satisfaction unto yourself and to your great glory and perfect happiness. Amen."]}};

const TYPE_N = { atk: ["โจมตี", "Attack"], skl: ["สกิล", "Skill"], pow: ["พลัง", "Power"] };

// one card's effect text; fx = live numbers (damage after Strength, gear and the target's state) while in a fight
function cardDesc(d, fx) {
  const p = [], all = d.all ? L(" ทุกตัว", " to ALL") : "";
  if (d.dmg) {
    const v = fx ? fx.dmg : d.dmg, cls = fx && v > d.dmg ? "up" : fx && v < d.dmg ? "down" : "";
    p.push(L("ดาเมจ ", "Deal ") + `<b class="${cls}">${v}</b>` + (d.hits > 1 ? "×" + d.hits : "") + all);
  }
  if (d.slam) p.push(L("ดาเมจเท่ากับ Block ที่มี", "Deal damage equal to your Block") + (fx ? ` (<b class="${fx.dmg ? "up" : "down"}">${fx.dmg}</b>)` : ""));
  if (d.block) { const v = fx ? fx.block : d.block; p.push(L("Block ", "Block ") + `<b class="${fx && v > d.block ? "up" : ""}">${v}</b>`); }
  if (d.vuln) p.push(`💢 Vulnerable ${d.vuln}` + (d.dmg ? "" : all));
  if (d.weak) p.push(`🥀 Weak ${d.weak}` + (d.dmg ? "" : all));
  if (d.burn) p.push(`🔥 Burn ${d.burn}` + (d.dmg && d.all ? "" : d.all ? all : ""));
  if (d.combo) p.push(L(`+${d.combo} ต่อการ์ดที่เล่นก่อนหน้าในเทิร์น`, `+${d.combo} per card played earlier this turn`));
  if (d.crit) p.push(`Crit +${pc(d.crit)}%`);
  if (d.dodge) p.push(`🌬️ ${L("หลบ", "Dodge")} ${d.dodge}`);
  if (d.exec) p.push(L("x2 ถ้าเป้า HP < 50%", "x2 vs targets under 50% HP"));
  if (d.grow) p.push(L(`⏳ สะสม +${d.grow} ทุกเทิร์นที่ถือไว้`, `⏳ +${d.grow} each turn you keep it`) + (fx && fx.held ? ` <b class="up">(+${d.grow * fx.held})</b>` : ""));
  if (d.lone) p.push(L(`🎲 ดาเมจ +${Math.round(d.lone * 100)}% ต่อช่องว่างในมือ`, `🎲 +${Math.round(d.lone * 100)}% damage per empty hand slot`));
  if (d.loneAll) p.push(L(`🪙 การ์ดโจมตีทุกใบ +${Math.round(d.loneAll * 100)}% ต่อช่องว่างในมือ (ไฟต์นี้)`, `🪙 all attacks +${Math.round(d.loneAll * 100)}% per empty hand slot (this fight)`));
  if (d.dump) p.push(L("ทิ้งการ์ดที่เหลือในมือทั้งหมด", "Discard your whole hand") + (d.dumpDmg ? L(` · ใบละ ${d.dumpDmg} ดาเมจใส่ศัตรูสุ่ม`, ` · ${d.dumpDmg} damage to a random enemy per card`) : ""));

const ENH_MAX = 10, ENH_STEP = 0.1, ENH_CHANCE = [1, 1, 1, 0.85, 0.7, 0.55, 0.45, 0.35, 0.25, 0.15];
const enhCost = it => Math.round(Math.max(100, defOf(it.id).price || 0) * RARITY[it.r].m * 0.3 * ((it.e || 0) + 1));
const MERGE_COUNT = 3;
const SCALED = ["atk", "crit", "def", "hp", "leech", "heavy", "combo", "luck", "goldMult", "startBlock", "killHeal"];
const INT_STATS = ["hp", "leech", "startBlock"];
const CATALOG = [...WEAPONS, ...OFFHANDS, ...ARMORS, ...ACCESSORIES];
const defOf = id => CATALOG.find(x => x.id === id);
const isWeaponId = id => WEAPONS.some(w => w.id === id);
const isHandId = id => isWeaponId(id) || OFFHANDS.some(o => o.id === id);
const kindOf = id => isHandId(id) ? "hand" : ARMORS.some(x => x.id === id) ? "armor" : "acc";
const itemBy = (pr, u) => u && pr.items.find(x => x.u === u);
function addItem(pr, id, r = 0) { const it = { u: newUid(), id, r }; pr.items.push(it); return it; }
// catalog entry with its positive stats scaled by rarity and enhance level
function view(it) {
  const d = defOf(it.id), m = RARITY[it.r].m * (1 + ENH_STEP * (it.e || 0)), v = { ...d, u: it.u, r: it.r, e: it.e || 0 };
  for (const k of SCALED) if (d[k] > 0) v[k] = INT_STATS.includes(k) ? Math.round(d[k] * m) : +(d[k] * m).toFixed(3);
  return v;
}
// ---- the two hands: pr.hands = [left uid, right uid]; a two-handed item sits in hands[0] and locks hands[1] ----
const HAND_N = [["มือซ้าย", "Left hand"], ["มือขวา", "Right hand"]];
const equippedUids = pr => new Set([...pr.hands, pr.armor, ...Object.values(pr.acc).flat()].filter(Boolean));
const handIt = (pr, i) => itemBy(pr, pr.hands[i]);
const twoHanded = pr => { const it = handIt(pr, 0); return !!it && defOf(it.id).hands === 2; };
function equipHand(pr, u, i) {
  const d = defOf(itemBy(pr, u).id);
  if (d.hands === 2) { pr.hands = [u, null]; return; }
  if (twoHanded(pr)) pr.hands = [null, null];
  const at = pr.hands.indexOf(u);
  if (at >= 0 && at !== i) pr.hands[at] = pr.hands[i]; // already in the other hand: the two swap
  pr.hands[i] = u;
}
function unequipHand(pr, i) { if (twoHanded(pr)) pr.hands = [null, null]; else pr.hands[i] = null; }
// a second weapon (in the right hand, next to another weapon) gives a share of its stats
const OFFHAND_WEAPON_SHARE = 0.5;
const offShareOf = pr => pr.passEquip.includes("dualmaster") ? PF.dualmaster(passLvOf(pr, "dualmaster") || 1) : OFFHAND_WEAPON_SHARE;
function offhandView(v, share) {
  v = { ...v };
  for (const k of SCALED) if (v[k] > 0) v[k] = INT_STATS.includes(k) ? Math.round(v[k] * share) : +(v[k] * share).toFixed(3);
  v.offhandWeapon = true; v.offShare = share;
  return v;
}
function handViews(pr) {
  const its = pr.hands.map(u => itemBy(pr, u)), weps = its.filter(it => it && isWeaponId(it.id)).length;

    pv.oready = !!m.on; pv.opub = m.on ? { hp: pvNum(p.hp, 1, 999), block: pvNum(p.block, 0, 999), dodge: pvNum(p.dodge, 0, 5), gear: String(p.gear || "").slice(0, 40), n: pvNum(p.n, 0, 99) } : null;
    if (pv.phase === "lobby") renderPv();
    pvpTryGo();
  } else if (m.t === "go") {
    if (pv.role === "guest" && pv.phase === "lobby" && pv.ready && pv.build && pv.opub) pvpStart(false);
  } else if (m.t === "turn") pvpGotTurn(m);
  else if (m.t === "lost") { if (pv.phase === "duel") pvpEnd(true, m.ff ? "ff" : ""); }
}

// ---- the duel ----
function pvpStart(first) {
  const b = pv.build, op = pv.opub, who = pv.opp || { name: "?", avatar: "🧑" };
  pv.phase = "duel"; closePause();
  run = { v: RUN_V, mode: "pvp", st: b.st, hp: b.hp, maxHp: b.hp, gold: 0, deck: b.ids.map(id => ({ id, up: 0, u: newUid() })), potions: 0, act: 1, floor: 0, depth: 0, kills: 0, found: [], gained: 0,
    map: null, pos: null, path: [], doors: null, combat: null, ov: null, node: null, ch: null, step: 0, rmCost: 0 }; // never stored in the profile
  const foe = { id: "_pvp", pvp: true, name: who.name, av: who.avatar, hp: op.hp, maxHp: op.hp, block: op.block, st: { str: 0, weak: 0, vuln: 0, burn: 0, dodge: op.dodge }, dmgS: 1, elite: false, boss: false, mi: 0, dead: false };
  run.combat = { kind: "pvp", foes: [foe], draw: shuffle(run.deck.map(c => ({ ...c }))), hand: [], disc: [], exh: [], en: 0, turn: 0, block: b.block, st: { str: 0, weak: 0, vuln: 0, burn: 0, dodge: b.dodge }, bpt: 0, dpt: 0, atks: 0, played: 0, tgt: 0, hits: [], base: null };
  layFor = null; hcur = null;
  busy = !first; // the second player waits for the first one's turn
  if (first) { pvpTurnStart(true); run.combat.en = Math.max(1, run.combat.en - 1); } // going first: one less energy on turn 1
  renderRun();
}
function pvpTurnStart(first) {
  const c = run.combat;
  startTurn(first);
  if (!pv || pv.phase !== "duel") return;
  if (c.turn > PV_FATIGUE) { hurtPlayer((c.turn - PV_FATIGUE) * 3, true); if (run.hp <= 0) return pvpLose(); } // fatigue: long stalls cost HP
  const f = c.foes[0]; c.base = { weak: f.st.weak, vuln: f.st.vuln, burn: f.st.burn }; c.hits = [];
}
const pvpSnap = c => ({ hp: run.hp, maxHp: run.maxHp, block: c.block, st: { str: c.st.str, weak: c.st.weak, vuln: c.st.vuln, burn: c.st.burn, dodge: c.st.dodge || 0 } });
function pvpSyncFoe(f, s) {
  const st = s.st || {};
  f.maxHp = pvNum(s.maxHp, 1, 999); f.hp = pvNum(s.hp, 0, f.maxHp); f.block = pvNum(s.block, 0, 999);
  f.st = { str: pvNum(st.str, 0, 99), weak: pvNum(st.weak, 0, 99), vuln: pvNum(st.vuln, 0, 99), burn: pvNum(st.burn, 0, 99), dodge: pvNum(st.dodge, 0, 9) };

}
// end of my turn: send what I dealt, then wait for theirs
async function pvpPhase(c) {
  busy = true;
  for (const ci of c.hand) ci.held = (ci.held || 0) + 1;
  if (pLv("patience") && c.hand.length) { const b = c.hand.length * PF.patience(pLv("patience")); c.block += b; floatAt($("pava"), `⏳🛡️+${b}`, "blk"); }
  if (c.st.weak) c.st.weak--;
  if (c.st.vuln) c.st.vuln--;
  const f = c.foes[0], b0 = c.base || { weak: 0, vuln: 0, burn: 0 };
  const deb = { w: Math.max(0, f.st.weak - b0.weak), v: Math.max(0, f.st.vuln - b0.vuln), b: Math.max(0, f.st.burn - b0.burn) };
  NET.send({ t: "turn", hits: c.hits, deb, snap: pvpSnap(c) });
  c.hits = [];
  renderCombat();
}
// their turn arrived: take their hits, then it is mine
async function pvpGotTurn(m) {
  const c = run && run.combat;
  if (!c || !pv || pv.phase !== "duel") return;
  busy = true;
  pvpSyncFoe(c.foes[0], m.snap || {});
  const hits = Array.isArray(m.hits) ? m.hits.slice(0, 60).map(h => pvNum(h, 0, 999)) : [], d = m.deb || {};
  renderCombat();
  for (const h of hits) {
    await wait(320);
    if (!run || run.combat !== c || pv.phase !== "duel") return;
    if (c.st.dodge > 0) { c.st.dodge--; floatAt($("pava"), "🌬️ " + L("หลบ!", "Dodge!"), "blk"); renderCombat(); continue; }
    if (Math.random() < Math.min(0.9, run.st.dodge || 0)) { floatAt($("pava"), "💨 Miss", "blk"); continue; }
    hurtPlayer(h); renderCombat();
    if (run.hp <= 0) break;
  }
  c.st.weak += pvNum(d.w, 0, 9); c.st.vuln += pvNum(d.v, 0, 9); c.st.burn += pvNum(d.b, 0, 99);
  if (run.hp <= 0) return pvpLose();
  await wait(250);
  if (!run || run.combat !== c || pv.phase !== "duel") return;
  busy = false;
  const firstGo = c.turn === 0;
  pvpTurnStart(false);
  if (!pv || pv.phase !== "duel") return;
  if (firstGo) { drawCards(1); c.block += 3; floatAt($("pava"), "🃏+1 🛡️+3", "heal"); } // going second: +1 card and 3 Block on the first turn
  saveStore(); renderCombat();
}

// ================= runs =================
let run = null;
const STORY_PATH = ["fight", "fight", "rest", "fight", "boss"];
const NODE = {
  fight: { ic: "⚔️", t: ["ต่อสู้", "Fight"], d: ["มอนสเตอร์ธรรมดา · ได้ทองและการ์ด", "Regular monsters · gold and a card"] },

  trial: { ic: "⚔️", t: ["ห้องท้าทาย", "Trial"], d: ["Elite + กฎพิเศษ 2 ข้อ · ชนะได้ Relic", "An Elite with 2 extra rules · win a relic"], endless: 1 },
  altar: { ic: "🗿", t: ["แท่นต้องสาป", "Cursed Altar"], d: ["Relic หายาก แลกกับคำสาป", "A rare relic, at the price of a curse"], endless: 1 },
  forge: { ic: "🔧", t: ["เตาหลอมการ์ด", "Card Forge"], d: ["ทำสำเนา แปลง หรืออัปเกรดการ์ด", "Copy, transform or upgrade cards"], endless: 1 },
  boss: { ic: "👑", t: ["บอส", "Boss"], d: ["ศัตรูท้าย Act · ได้อุปกรณ์แน่นอน", "The act's boss · always drops gear"] },
};
const MAP_ROWS = 11, LANES = 5, ROOMS_PER_ACT = 6, ACTS = 3;

function newRun(mode, ch, deckIds) {
  const pr = prof(), st = statsOf(pr);
  const potions = Math.min(3, pr.inv.potion || 0);
  pr.inv.potion = (pr.inv.potion || 0) - potions;
  const deck = (deckIds ? [...st.cards, ...deckIds] : [...Array(5).fill("strike"), ...Array(4).fill("defend"), ...st.cards]).map(id => ({ id, up: 0, u: newUid() }));
  run = pr.run = { v: RUN_V, mode, st, hp: st.hp, maxHp: st.hp, gold: 0, deck, potions, act: 1, floor: 0, depth: 0, kills: 0, found: [], gained: 0,
    map: null, pos: null, path: [], doors: null, combat: null, ov: null, node: null, ch: ch ?? null, step: 0, rmCost: 75 };
  pr.stats.runs++;
  if (mode === "map") run.map = genMap();
  else if (mode !== "story") setDoors();
  saveStore();
  openRun();
}

// --- branching map: a few walkers climb the rows, drifting one lane at a time; the boss sits above the last row ---
function genMap() {
  const nodes = {}, edges = [];
  for (let w = 0; w < 4; w++) {
    let l = w === 0 ? 1 : w === 1 ? 3 : Math.floor(Math.random() * LANES);
    for (let r = 0; r < MAP_ROWS; r++) {
      nodes[r + "," + l] = { r, l };
      if (r < MAP_ROWS - 1) {
        const nl = clamp(l + rand([-1, 0, 1]), 0, LANES - 1), e = `${r},${l}>${r + 1},${nl}`;
        if (!edges.includes(e)) edges.push(e);
        l = nl;
      }
    }
  }
  for (const k in nodes) {
    const n = nodes[k], r = n.r;
    n.type = r === 0 ? "fight" : r === 5 ? "treasure" : r === MAP_ROWS - 1 ? "rest"
      : ["fight", "event", "elite", "shop", "rest"][weightedIdx([50, 22, r >= 3 ? 14 : 0, 12, r >= 4 && r !== MAP_ROWS - 2 ? 10 : 0])];
  }
  const bk = MAP_ROWS + ",2";
  nodes[bk] = { r: MAP_ROWS, l: 2, type: "boss" };
  for (const k in nodes) if (nodes[k].r === MAP_ROWS - 1) edges.push(`${k}>${bk}`);
  return { nodes, edges };
}
const mapNext = () => {
  const M = run.map;
  if (!run.pos) return Object.keys(M.nodes).filter(k => M.nodes[k].r === 0);
  return M.edges.filter(e => e.startsWith(run.pos + ">")).map(e => e.split(">")[1]);
};
// --- doors (Dungeon Rooms / Endless Tower) ---
function genDoors() {
  const n = run.floor + 1;
  if (run.mode === "rooms" || run.mode === "arena") {
    const inAct = (n - 1) % ROOMS_PER_ACT + 1;
    if (inAct === ROOMS_PER_ACT) return ["boss"];
    if (inAct === 1) return ["fight", "fight"];
    if (inAct === ROOMS_PER_ACT - 1) return uniqDoors(["rest"], 3);
    return uniqDoors([], rand([2, 3]), inAct >= 3);
  }
  if (n % 5 === 0) return ["boss"];
  if (n % 5 === 4) return uniqDoors(["rest"], 3);
  return uniqDoors([], rand([2, 3]), n > 2);
}
function uniqDoors(start, count, elite = true) {
  const out = [...start];
  for (let tries = 0; out.length < count && tries < 40; tries++) {
    const n = run.floor + 1, ex = run.mode === "endless" && n >= 3; // the Endless Tower adds its own rooms
    const ty = ["fight", "event", "elite", "shop", "treasure", "rest", "market", "trial", "altar", "forge"][weightedIdx([46, 22, elite ? 14 : 0, 10, 6, 6, ex ? 6 : 0, ex && n >= 6 ? 6 : 0, ex ? 5 : 0, ex ? 6 : 0])];
    if (!out.includes(ty) || (ty === "fight" && out.filter(x => x === "fight").length < 2)) out.push(ty);
  }
  return out;
}
const runAct = () => run.mode === "endless" ? Math.min(3, 1 + Math.floor(run.floor / 10)) : run.mode === "story" ? 1 + run.ch : run.act;

function enterNode(type) {
  run.depth++; run.node = type;
  if (type === "fight" || type === "elite" || type === "boss") return startCombat(type);
  if (type === "rest") run.ov = { k: "rest" };
  else if (type === "shop") run.ov = genShop();
  else if (type === "event") run.ov = { k: "event", id: rand(EVENTS.filter(e => !e.special)).id, res: null };
  else if (type === "market") { run.mkt = genMarket(); run.ov = { k: "event", id: "x_market", res: null }; }
  else if (type === "trial") { run.trials = [twoMods(), twoMods()]; run.ov = { k: "event", id: "x_trial", res: null }; }
  else if (type === "altar") run.ov = { k: "event", id: "x_altar", res: null };
  else if (type === "forge") run.ov = { k: "event", id: "x_forge", res: null };
  else if (type === "treasure") run.ov = treasure();
  saveStore(); renderRun();
}
// a non-fight node is done (or a fight's rewards were collected): back to the path
function nodeDone() {
  const wasBoss = run.node === "boss";
  run.ov = null; run.node = null; run.combat = null;
  if (run.mode === "story") {
    run.step++;
    if (run.step >= STORY_PATH.length) return storyClear();
  } else if (wasBoss && run.mode !== "endless") {
    run.act++;
    if (run.act > ACTS) return endRun(true);
    run.hp = Math.min(run.maxHp, run.hp + Math.round((run.maxHp - run.hp) * 0.5)); // between acts: heal half of what's missing
    if (run.mode === "map") { run.map = genMap(); run.pos = null; run.path = []; run.floor = 0; }
  }
  if (run.mode === "rooms" || run.mode === "arena" || run.mode === "endless") setDoors();
  run.mods = []; run.trialOn = false;
  saveStore(); renderRun();
}

const SYN_W = 1.5;
function cardWeight(id) {

}

  const lk = luck(), ws = [w[0], w[1] * (1 + lk), w[2] * (1 + 2 * lk)], out = [];

}

  addItem(pr, g.id); run.found.push(g.id);

}

}

  if (run.mode === "pvp") return pvpPhase(c);

  for (const ci of c.hand) ci.held = (ci.held || 0) + 1;
  if (pLv("patience") && c.hand.length) { const b = c.hand.length * PF.patience(pLv("patience")); c.block += b; floatAt($("pava"), `⏳🛡️+${b}`, "blk"); }

  if (c.st.vuln) c.st.vuln--;

  for (const f of c.foes) {
    if (f.dead) continue;
    await wait(380);
    if (run.combat !== c) { busy = false; return; } // the fight was left meanwhile
    f.block = 0;
    if (f.st.burn) {
      damageFoe(f, f.st.burn + (PG().burnTick || 0), false); f.st.burn -= burnDecay(f.st.burn);
      if (f.dead) { renderCombat(); continue; }
    }

    if (m.s) f.st.str += m.s;
    if (m.heal) { const h = Math.min(Math.round(m.heal * f.dmgS), f.maxHp - f.hp); f.hp += h; if (h) floatAt(el, "+" + h, "heal"); }
    if (m.w) c.st.weak += m.w;
    if (m.v) c.st.vuln += m.v;
    if (m.burn) c.st.burn += m.burn;
    if (m.seal) { c.seal = m.seal; floatAt($("pava"), m.seal === "atk" ? "🔒⚔️ +1⚡" : "🔒🛡️ +1⚡", "bad"); }
    if (m.summon && c.foes.filter(x => !x.dead).length < 4) { const nf = mkFoe(m.summon, run.depth, { pair: true }); if (run.mode === "endless" && zoneOf(run.floor).id === "haunt") nf.dodgeCh = 0.1; c.foes.push(nf); }
    if (m.drain) { const tk = Math.min(c.block, Math.round(m.drain * f.dmgS)); if (tk) { c.block -= tk; f.block += tk; floatAt(el, "🧲🛡️+" + tk, "blk"); } }
    if (m.a) {
      animFoe(f, "lunge");
      for (let h = 0; h < (m.h || 1); h++) {
        if (c.st.dodge > 0) { c.st.dodge--; floatAt($("pava"), "🌬️ " + L("หลบ!", "Dodge!"), "blk"); continue; }
        if (Math.random() < Math.min(0.9, run.st.dodge || 0)) { floatAt($("pava"), "💨 Miss", "blk"); continue; }
        hurtPlayer(foeHit(f, m));
        if (pLv("thorns") && !f.dead) damageFoe(f, PF.thorns(pLv("thorns")), false);
        if (rl("r_mirror") && !f.dead) damageFoe(f, 3, false);
        if (run.hp <= 0) break;
      }
    }
    if (f.st.weak) f.st.weak--;
    if (f.st.vuln) f.st.vuln--;

    if (run.hp <= 0) { busy = false; return loseFight(); }

  if (!aliveFoes().length) return winFight();

  saveStore(); renderCombat();
}
function winFight() {

  const scale = run.mode === "endless" ? 1 + 0.03 * run.floor : 1 + 0.2 * (act - 1);
  const gold = gainGold(base * scale * (c.goldX || 1)), loot = [`💰 +${gold}`, `⭐ +${c.xpGot || 0} XP`];
